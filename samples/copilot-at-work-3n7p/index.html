<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <!-- Unlisted work sample: shared by direct link only, never linked from the site. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Copilot at Work</title>
  <meta name="description" content="A short course on the everyday tasks people do with Microsoft Copilot in Outlook, Teams, Word, Excel, and PowerPoint.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Public+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ----- Tokens. Light reading surface, Arbolinea type, one accent. ----- */
    :root {
      --page: #F4F7F5;
      --surface: #FFFFFF;
      --tint: #EEF4F8;
      --line: #D9E0DB;
      --line-strong: #B9C4BD;
      --ink: #15201B;
      --ink-2: #33423A;
      --ink-3: #5C6B63;
      --accent: #2F6E97;
      --accent-ink: #1F4D6B;
      --accent-soft: #DCEBF5;
      --ok: #25663F;
      --ok-soft: #E1F2E7;
      --no: #A63C33;
      --no-soft: #F8E4E1;
      --band: #0E1411;
      --band-text: #EFF3EE;
      --band-muted: #B8C2BA;
      --ice: #8FC6E8;
      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-body: "Public Sans", system-ui, sans-serif;
      --font-mono: "Spline Sans Mono", ui-monospace, monospace;
      --radius: 14px;
      --radius-sm: 10px;
      --col: 760px;
      --nav-w: 300px;
      --topbar: 60px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--page); color-scheme: light; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--page); color: var(--ink-2); font-family: var(--font-body); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; color: var(--ink); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
    p { margin: 0; }
    a { color: var(--accent); }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    strong { color: var(--ink); font-weight: 600; }
    code, .mono { font-family: var(--font-mono); font-size: 0.92em; }

    /* ----- Top bar ----- */
    .topbar { position: sticky; top: 0; z-index: 20; height: var(--topbar); background: var(--band); color: var(--band-text); display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid #26302A; }
    .topbar .brand { display: flex; align-items: center; gap: 10px; color: var(--band-text); text-decoration: none; font-family: var(--font-display); font-size: 17px; }
    .topbar .brand svg { width: 22px; height: 22px; color: var(--ice); }
    .topbar .course-name { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--band-muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-btn { display: none; background: transparent; border: 1px solid #3A463F; color: var(--band-text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; }
    .progress-rail { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: #26302A; }
    .progress-rail > span { display: block; height: 100%; width: 0; background: var(--ice); transition: width 300ms ease; }

    /* ----- Layout: outline + lesson ----- */
    .shell { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: calc(100vh - var(--topbar)); background: var(--page); }
    .outline { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 18px 40px; position: sticky; top: var(--topbar); height: calc(100vh - var(--topbar)); overflow-y: auto; }
    .outline h2 { font-size: 13px; font-family: var(--font-mono); font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 14px 8px; }
    .outline ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .outline button { width: 100%; text-align: left; background: transparent; border: 0; border-radius: var(--radius-sm); padding: 9px 10px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; color: var(--ink-2); line-height: 1.35; font-size: 15px; }
    .outline button:hover { background: var(--tint); }
    .outline button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }
    .outline .dot { flex: 0 0 18px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); margin-top: 2px; display: grid; place-items: center; }
    .outline .dot svg { width: 10px; height: 10px; display: none; }
    .outline .done .dot { background: var(--ok); border-color: var(--ok); }
    .outline .done .dot svg { display: block; color: #fff; }
    .outline .pct { margin: 18px 8px 0; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.06em; }
    .outline .bar { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 8px 0; overflow: hidden; }
    .outline .bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width 300ms ease; }

    main { background: var(--page); min-width: 0; }
    .lesson { width: min(var(--col), 100% - 32px); margin: 0 auto; padding: 36px 0 80px; background: var(--page); }
    .lesson-head { padding: 8px 0 28px; border-bottom: 1px solid var(--line); margin-bottom: 36px; }
    .lesson-head .count { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
    .lesson-head h1 { font-size: clamp(30px, 4.6vw, 42px); margin-top: 10px; }
    .lesson-head .intro { margin-top: 16px; font-size: 19px; color: var(--ink-2); max-width: 60ch; }
    .lesson-head .made { margin-top: 16px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }

    .blocks { display: flex; flex-direction: column; gap: 34px; }
    .block { background: var(--page); }
    .block h2 { font-size: 26px; margin-bottom: 12px; }
    .block h3 { font-size: 20px; }
    .block p + p { margin-top: 12px; }
    .block ul, .block ol { margin: 0; padding-left: 22px; }
    .block li + li { margin-top: 8px; }

    /* Statement / callout */
    .statement { border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0; padding: 18px 22px; }
    .statement .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .statement p { font-size: 18px; color: var(--ink); }

    /* Checklist */
    .checklist { list-style: none; padding: 0; }
    .checklist li { display: flex; gap: 12px; align-items: flex-start; }
    .checklist input { margin-top: 6px; width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }

    /* Two column */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .two-col > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
    .two-col h3 { font-size: 17px; margin-bottom: 8px; }

    /* Accordion */
    .accordion { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
    .acc-item + .acc-item { border-top: 1px solid var(--line); }
    .acc-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; background: transparent; border: 0; padding: 16px 20px; cursor: pointer; font-family: var(--font-display); font-size: 18px; color: var(--ink); }
    .acc-btn:hover { background: var(--tint); }
    .acc-btn svg { width: 18px; height: 18px; flex: 0 0 auto; transition: transform 200ms ease; color: var(--accent); }
    .acc-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
    .acc-panel { padding: 0 20px 18px; }
    .acc-panel[hidden] { display: none; }

    /* Tabs */
    .tabs [role="tablist"] { display: flex; gap: 4px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
    .tabs [role="tab"] { background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -2px; padding: 10px 16px; cursor: pointer; font-family: var(--font-display); font-size: 16px; color: var(--ink-3); }
    .tabs [role="tab"][aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
    .tabs [role="tabpanel"] { padding: 20px 4px 0; }
    .tabs [role="tabpanel"][hidden] { display: none; }

    /* Flashcards */
    .flashcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .card-btn { position: relative; min-height: 150px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 8px; transition: transform 160ms ease, border-color 160ms ease; }
    .card-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-btn .side { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    .card-btn .back-text { display: none; }
    .card-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
    .card-btn[aria-pressed="true"] .front-text { display: none; }
    .card-btn[aria-pressed="true"] .back-text { display: block; }
    .flash-hint { margin-top: 10px; font-size: 14px; color: var(--ink-3); }

    /* Process */
    .process { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
    .process .step-head { display: flex; align-items: center; gap: 14px; }
    .process .num { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--font-mono); font-size: 14px; flex: 0 0 auto; }
    .process h3 { font-size: 20px; }
    .process .step-body { margin-top: 14px; min-height: 60px; }
    .process .step-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .process .dots { display: flex; gap: 6px; }
    .process .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
    .process .dots span.on { background: var(--accent); }

    /* Demo: step captures */
    .demo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
    .demo .demo-head { display: flex; align-items: center; gap: 14px; }
    .demo .num { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--font-mono); font-size: 14px; flex: 0 0 auto; }
    .demo h3 { font-size: 20px; }
    .demo .step-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .demo .dots { display: flex; gap: 6px; }
    .demo .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
    .demo .dots span.on { background: var(--accent); }
    .demo .audit-step { margin-top: 16px; }
    .demo .audit-step img { width: 100%; height: auto; }

    /* Prompt cards */
    .prompt-cards { display: grid; gap: 14px; }
    .prompt-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .pc-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
    .pc-app { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    .pc-task { font-family: var(--font-display); font-size: 17px; color: var(--ink); }
    .pc-text { background: var(--page); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 16px; color: var(--ink); white-space: pre-wrap; }
    .pc-note { margin-top: 8px; font-size: 14px; color: var(--ink-3); }
    .prompt-card .copy { margin-top: 10px; }

    .link-row { display: flex; gap: 12px; flex-wrap: wrap; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 500; cursor: pointer; text-decoration: none; font-size: 16px; }
    .btn:hover { background: var(--accent-ink); }
    .btn:active { transform: translateY(1px); }
    .btn.ghost { background: transparent; color: var(--accent-ink); border: 1px solid var(--line-strong); }
    .btn.ghost:hover { background: var(--tint); }
    .btn[disabled] { opacity: 0.45; cursor: default; }
    .btn.small { padding: 7px 14px; font-size: 14px; }

    /* Mockup: a drawn Copilot chat panel. Not a screenshot. */
    .mockup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .mockup .mk-top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--tint); border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }
    .mockup .mk-top i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); display: inline-block; }
    .mockup .mk-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .mk-msg { max-width: 92%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 16px; }
    .mk-msg.user { align-self: flex-end; background: var(--accent-soft); color: var(--accent-ink); border-bottom-right-radius: 4px; }
    .mk-msg.bot { align-self: flex-start; background: var(--page); border: 1px solid var(--line); color: var(--ink-2); border-bottom-left-radius: 4px; }
    .mk-msg .who { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; display: block; margin-bottom: 4px; color: var(--ink-3); }
    .mk-msg ul { margin: 6px 0 0; padding-left: 18px; }
    .mk-input { margin: 4px 18px 16px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 10px 16px; color: var(--ink-3); font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .mk-input b { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: inline-block; }
    .mk-caption { margin-top: 10px; font-size: 14px; color: var(--ink-3); }
    .mk-drawn { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; }
    .capture img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

    /* Before / after prompts */
    .before-after { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .before-after > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .before-after .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
    .before-after .weak .tag { color: var(--no); }
    .before-after .strong-p .tag { color: var(--ok); }
    .before-after p { font-size: 16px; }
    .ba-note { grid-column: 1 / -1; font-size: 15px; color: var(--ink-3); }

    /* Labeled graphic: hotspots on the mockup */
    .labeled { position: relative; }
    .hotspot { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(21,32,27,0.25); cursor: pointer; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; transform: translate(-50%, -50%); padding: 0; }
    .hotspot[aria-expanded="true"] { background: var(--accent-ink); }
    .hot-panel { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius-sm); padding: 14px 18px; }
    .hot-panel[hidden] { display: none; }
    .hot-panel h3 { font-size: 17px; margin-bottom: 4px; }
    .hot-list { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
    .hot-list button { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
    .hot-list button[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

    /* Sorting */
    .sorting .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 12px; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); margin-bottom: 16px; }
    .sort-card { background: var(--page); border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 14px; font-size: 15px; cursor: pointer; }
    .sort-card[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    .sort-card.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
    .sort-card.wrong { border-color: var(--no); background: var(--no-soft); color: var(--ink); }
    .sorting .cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .cat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-height: 110px; }
    .cat h3 { font-size: 15px; font-family: var(--font-mono); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 8px; }
    .cat .drop { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; }
    .cat button.drop-btn { width: 100%; margin-top: 8px; background: transparent; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 6px; font-size: 13px; color: var(--ink-3); cursor: pointer; }
    .cat button.drop-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
    .sort-hint { margin: 10px 0 0; font-size: 14px; color: var(--ink-3); }
    .sort-actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* Scenario */
    .scenario { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
    .scenario .setup { font-size: 17px; color: var(--ink); }
    .scenario .choices { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .choice { text-align: left; background: var(--page); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 12px 16px; cursor: pointer; font-size: 16px; }
    .choice:hover { border-color: var(--accent); }
    .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .outcome { margin-top: 16px; padding: 14px 18px; border-radius: var(--radius-sm); border-left: 4px solid var(--line-strong); background: var(--page); }
    .outcome[hidden] { display: none; }
    .outcome.best { border-left-color: var(--ok); background: var(--ok-soft); }
    .outcome.okay { border-left-color: var(--no); background: var(--no-soft); }
    .outcome .verdict { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }

    /* Knowledge checks and quiz */
    .kc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
    .kc .kc-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    .kc .q { font-size: 19px; color: var(--ink); margin-top: 8px; font-family: var(--font-display); }
    .kc .q-type { font-size: 14px; color: var(--ink-3); margin-top: 4px; }
    .kc .opts { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .opt { display: flex; gap: 12px; align-items: flex-start; background: var(--page); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 11px 14px; cursor: pointer; }
    .opt:hover { border-color: var(--accent); }
    .opt input { margin-top: 5px; accent-color: var(--accent); flex: 0 0 auto; }
    .opt.right { border-color: var(--ok); background: var(--ok-soft); }
    .opt.wrong { border-color: var(--no); background: var(--no-soft); }
    .opt.missed { border-color: var(--ok); border-style: dashed; }
    .kc input[type="text"] { font: inherit; width: 100%; max-width: 360px; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); margin-top: 12px; background: var(--page); color: var(--ink); }
    .kc .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .fb { margin-top: 14px; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 16px; }
    .fb[hidden] { display: none; }
    .fb.good { background: var(--ok-soft); border-left: 4px solid var(--ok); }
    .fb.bad { background: var(--no-soft); border-left: 4px solid var(--no); }
    .fb .verdict { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 4px; }
    .fb ul { margin: 8px 0 0; padding-left: 18px; }
    .kc-set { display: flex; flex-direction: column; gap: 16px; }

    .quiz-results { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; text-align: center; }
    .quiz-results .score { font-family: var(--font-display); font-size: 44px; color: var(--ink); }
    .quiz-results p { margin-top: 8px; }

    /* Continue divider */
    .continue { text-align: center; padding: 8px 0; }
    .continue .btn { min-width: 200px; justify-content: center; }
    .divider { border: 0; border-top: 1px solid var(--line); margin: 0; }

    /* Lesson nav */
    .lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); }
    .lesson-nav a, .lesson-nav button { flex: 1; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; color: var(--ink); cursor: pointer; text-align: left; }
    .lesson-nav .next { text-align: right; align-items: flex-end; }
    .lesson-nav a:hover, .lesson-nav button:hover { border-color: var(--accent); }
    .lesson-nav .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    .lesson-nav .placeholder { visibility: hidden; }

    /* Cover */
    .cover { width: min(880px, 100% - 32px); margin: 0 auto; padding: clamp(40px, 7vw, 80px) 0 60px; background: var(--page); }
    .cover .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
    .cover h1 { font-size: clamp(36px, 6vw, 60px); margin-top: 12px; }
    .cover .sub { font-size: 20px; margin-top: 18px; max-width: 58ch; }
    .cover .facts { margin-top: 24px; display: flex; gap: 24px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); letter-spacing: 0.04em; }
    .cover .start { margin-top: 28px; }
    .cover .cover-outline { margin-top: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 8px; }
    .cover .cover-outline h2 { font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); padding: 10px 14px 6px; }
    .cover .cover-outline ol { list-style: none; margin: 0; padding: 0; }
    .cover .cover-outline li a { display: flex; gap: 14px; align-items: baseline; padding: 11px 14px; border-radius: var(--radius-sm); text-decoration: none; color: var(--ink); }
    .cover .cover-outline li a:hover { background: var(--tint); }
    .cover .cover-outline .n { font-family: var(--font-mono); font-size: 12px; color: var(--accent); min-width: 22px; }
    .cover .cover-outline .d { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
    .cover .madeline { margin-top: 20px; font-size: 15px; color: var(--ink-3); max-width: 62ch; }

    /* Audit mode: every lesson stacked for the headless check */
    body.audit .outline { display: none; }
    body.audit .shell { grid-template-columns: 1fr; }
    body.audit main { width: 380px; margin: 0; overflow: auto; }
    body.audit .lesson { padding-bottom: 20px; }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .outline { position: fixed; top: var(--topbar); left: 0; bottom: 0; width: min(320px, 88vw); transform: translateX(-100%); transition: transform 220ms ease; z-index: 15; box-shadow: 0 0 0 100vw rgba(0,0,0,0); height: auto; }
      .outline.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.25); }
      .menu-btn { display: inline-block; }
      .two-col, .before-after { grid-template-columns: 1fr; }
      .lesson-nav { flex-direction: column; }
      .lesson-nav .placeholder { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }

  </svg>

  <header class="topbar">

  <div class="shell">

      <h2>Lessons</h2>
      <ol id="outlineList"></ol>

      <div class="bar"><span id="barFill"></span></div>
    </nav>
    <main id="main"></main>
  </div>

  <script src="content.js?v=20261111a"></script>
  <script>
  (function () {
    "use strict";
    const main = document.getElementById("main");
    const course = window.COURSE;
    if (!course || !Array.isArray(course.lessons)) {
      main.innerHTML = '<section class="lesson"><div class="block statement"><div class="label">Content did not load</div><p>content.js is missing or has a syntax error. Open it in an editor and look for a missing comma, bracket, or quote near your last edit.</p></div></section>';
      return;
    }
    const AUDIT = new URLSearchParams(location.search).get("audit") === "1";
    const KEY = "copilot-at-work-progress";

    /* ---------- helpers ---------- */
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    // Inline markup: **bold**, `code`, and line breaks. Content is ours, not user input, so this stays simple.
    const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
    const paras = v => (Array.isArray(v) ? v : [v]).map(p => `<p>${inline(p)}</p>`).join("");
    const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
    const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    let uid = 0; const id = p => `${p}-${++uid}`;

    function loadProgress() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
    function saveProgress(p) { try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) { console.warn("Progress was not saved: " + e.message); } }
    let progress = loadProgress();

    /* ---------- block renderers. One function per block type. ---------- */
    const RENDER = {
      heading(b) { return el(`<div class="block"><h2>${inline(b.text)}</h2>${b.sub ? `<p>${inline(b.sub)}</p>` : ""}</div>`); },

      text(b) { return el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}${paras(b.body)}</div>`); },

      statement(b) { return el(`<div class="block statement">${b.label ? `<div class="label">${inline(b.label)}</div>` : ""}<p>${inline(b.text)}</p></div>`); },

      list(b) {
        const tag = b.style === "number" ? "ol" : "ul";
        if (b.style === "check") {
          const items = b.items.map((t, i) => `<li><input type="checkbox" id="${id("ck")}" aria-label="${esc(t)}"><span>${inline(t)}</span></li>`).join("");
          return el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}<ul class="checklist">${items}</ul></div>`);
        }
        return el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}<${tag}>${b.items.map(t => `<li>${inline(t)}</li>`).join("")}</${tag}></div>`);
      },

      twocol(b) {
        return el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}<div class="two-col">${b.columns.map(c => `<div><h3>${inline(c.title)}</h3>${paras(c.body)}</div>`).join("")}</div></div>`);
      },

      accordion(b) {
        const root = el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}${b.intro ? `<p style="margin-bottom:14px">${inline(b.intro)}</p>` : ""}<div class="accordion"></div></div>`);
        const acc = root.querySelector(".accordion");
        b.items.forEach(item => {
          const pid = id("acc");
          const it = el(`<div class="acc-item"><h3><button class="acc-btn" aria-expanded="false" aria-controls="${pid}"><span>${inline(item.title)}</span><svg><use href="#chev"/></svg></button></h3><div class="acc-panel" id="${pid}" hidden>${paras(item.body)}</div></div>`);
          const btn = it.querySelector("button"), panel = it.querySelector(".acc-panel");
          btn.addEventListener("click", () => { const open = btn.getAttribute("aria-expanded") === "true"; btn.setAttribute("aria-expanded", String(!open)); panel.hidden = open; });
          acc.appendChild(it);
        });
        return root;
      },

      tabs(b) {
        const root = el(`<div class="block tabs">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}<div role="tablist" aria-label="${esc(b.heading || "Tabs")}"></div></div>`);
        const list = root.querySelector("[role=tablist]");
        const panels = [];
        b.items.forEach((item, i) => {
          const tid = id("tab"), pid = id("panel");
          const tab = el(`<button role="tab" id="${tid}" aria-selected="${i === 0}" aria-controls="${pid}" tabindex="${i === 0 ? 0 : -1}">${inline(item.title)}</button>`);
          const panel = el(`<div role="tabpanel" id="${pid}" aria-labelledby="${tid}" ${i === 0 ? "" : "hidden"}>${paras(item.body)}</div>`);
          list.appendChild(tab); root.appendChild(panel); panels.push([tab, panel]);
          tab.addEventListener("click", () => select(i));
          tab.addEventListener("keydown", e => { if (e.key === "ArrowRight") select((i + 1) % panels.length, true); if (e.key === "ArrowLeft") select((i - 1 + panels.length) % panels.length, true); });
        });
        function select(n, focus) { panels.forEach(([t, p], k) => { t.setAttribute("aria-selected", String(k === n)); t.tabIndex = k === n ? 0 : -1; p.hidden = k !== n; }); if (focus) panels[n][0].focus(); }
        return root;
      },

      flashcards(b) {
        const root = el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}${b.intro ? `<p style="margin-bottom:14px">${inline(b.intro)}</p>` : ""}<div class="flashcards"></div><p class="flash-hint">Try to answer in your head before you turn each card.</p></div>`);
        const grid = root.querySelector(".flashcards");
        b.cards.forEach(c => {
          const card = el(`<button class="card-btn" aria-pressed="false"><span class="side front-side">Situation</span><span class="front-text">${inline(c.front)}</span><span class="back-text">${inline(c.back)}</span></button>`);
          card.addEventListener("click", () => { const on = card.getAttribute("aria-pressed") === "true"; card.setAttribute("aria-pressed", String(!on)); card.querySelector(".side").textContent = on ? (b.frontLabel || "Situation") : (b.backLabel || "Prompt"); });
          card.querySelector(".side").textContent = b.frontLabel || "Situation";
          grid.appendChild(card);
        });
        return root;
      },

      process(b) {
        const root = el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}<div class="process"><div class="step-head"><span class="num"></span><h3></h3></div><div class="step-body"></div><div class="step-nav"><button class="btn ghost small prev">Back</button><div class="dots"></div><button class="btn small next">Next</button></div></div></div>`);
        const steps = b.steps; let i = 0;
        const num = root.querySelector(".num"), h = root.querySelector("h3"), body = root.querySelector(".step-body"), dots = root.querySelector(".dots"), prev = root.querySelector(".prev"), next = root.querySelector(".next");
        steps.forEach(() => dots.appendChild(el(`<span></span>`)));
        function show() { num.textContent = i + 1; h.textContent = steps[i].title; body.innerHTML = paras(steps[i].body); [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i)); prev.disabled = i === 0; next.textContent = i === steps.length - 1 ? "Done" : "Next"; next.disabled = i === steps.length - 1 && b.loop === false; }
        prev.addEventListener("click", () => { if (i > 0) { i--; show(); } });
        next.addEventListener("click", () => { if (i < steps.length - 1) { i++; show(); } else { i = 0; show(); } });
        show();
        if (AUDIT) { body.innerHTML = steps.map(s => `<h4>${inline(s.title)}</h4>${paras(s.body)}`).join(""); }
        return root;
      },

      mockup(b) {
        const msgs = (b.messages || []).map(m => `<div class="mk-msg ${m.from === "you" ? "user" : "bot"}"><span class="who">${m.from === "you" ? "You" : "Copilot"}</span>${inline(m.text)}${m.bullets ? `<ul>${m.bullets.map(x => `<li>${inline(x)}</li>`).join("")}</ul>` : ""}</div>`).join("");
        return el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}<figure class="mockup" style="margin:0" role="img" aria-label="${esc(b.alt || "A drawing of a Copilot chat")}"><div class="mk-top"><i></i><i></i><i></i><span>${esc(b.app || "Copilot Chat")}</span></div><div class="mk-body">${msgs}</div><div class="mk-input"><span>${esc(b.placeholder || "Message Copilot")}</span><b></b></div></figure><p class="mk-caption">${b.caption ? inline(b.caption) + " " : ""}<span class="mk-drawn">Drawn illustration, not a screenshot.</span></p></div>`);
      },

      beforeafter(b) {
        const pairs = b.pairs.map(p => `<div class="weak"><div class="tag">Weak</div><p>${inline(p.before)}</p></div><div class="strong-p"><div class="tag">Better</div><p>${inline(p.after)}</p></div>${p.note ? `<p class="ba-note">${inline(p.note)}</p>` : ""}`).join("");
        return el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}<div class="before-after">${pairs}</div></div>`);
      },

      labeled(b) {
        const root = el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}${b.intro ? `<p style="margin-bottom:14px">${inline(b.intro)}</p>` : ""}<div class="labeled"></div><div class="hot-list" role="group" aria-label="Labels"></div><div class="hot-panel" hidden><h3></h3><div class="hp-body"></div></div></div>`);
        const wrap = root.querySelector(".labeled"), list = root.querySelector(".hot-list"), panel = root.querySelector(".hot-panel");
        const mk = RENDER.mockup(b.mockup); wrap.appendChild(mk.querySelector(".mockup")); root.insertBefore(mk.querySelector(".mk-caption"), root.querySelector(".hot-list"));
        const buttons = [];
        b.spots.forEach((s, i) => {
          const dot = el(`<button class="hotspot" aria-expanded="false" style="left:${s.x}%;top:${s.y}%" aria-label="${esc(s.title)}">${i + 1}</button>`);
          const chip = el(`<button aria-expanded="false">${i + 1}. ${inline(s.title)}</button>`);
          const open = () => { const on = dot.getAttribute("aria-expanded") === "true"; buttons.forEach(([d, c]) => { d.setAttribute("aria-expanded", "false"); c.setAttribute("aria-expanded", "false"); }); if (!on) { dot.setAttribute("aria-expanded", "true"); chip.setAttribute("aria-expanded", "true"); panel.hidden = false; panel.querySelector("h3").textContent = s.title; panel.querySelector(".hp-body").innerHTML = paras(s.body); } else panel.hidden = true; };
          dot.addEventListener("click", open); chip.addEventListener("click", open);
          wrap.appendChild(dot); list.appendChild(chip); buttons.push([dot, chip]);
        });
        if (AUDIT) { panel.hidden = false; panel.querySelector(".hp-body").innerHTML = b.spots.map(s => `<h4>${inline(s.title)}</h4>${paras(s.body)}`).join(""); }
        return root;
      },

      sorting(b) {
        const root = el(`<div class="block sorting">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}${b.intro ? `<p style="margin-bottom:14px">${inline(b.intro)}</p>` : ""}<div class="pool" aria-label="Cards to sort"></div><div class="cats"></div><p class="sort-hint">Tap a card, then tap the group it belongs in. Or drag it.</p><div class="sort-actions"><button class="btn small check">Check my answers</button><button class="btn ghost small reset">Start over</button><span class="sort-result" aria-live="polite"></span></div></div>`);
        const pool = root.querySelector(".pool"), cats = root.querySelector(".cats"), result = root.querySelector(".sort-result");
        let selected = null;
        const cards = shuffle(b.cards).map(c => { const d = el(`<button class="sort-card" draggable="true" aria-pressed="false" data-cat="${esc(c.category)}">${inline(c.text)}</button>`); d.addEventListener("click", () => { if (selected === d) { d.setAttribute("aria-pressed", "false"); selected = null; } else { if (selected) selected.setAttribute("aria-pressed", "false"); selected = d; d.setAttribute("aria-pressed", "true"); } }); d.addEventListener("dragstart", e => { selected = d; e.dataTransfer.setData("text/plain", "card"); }); return d; });
        cards.forEach(c => pool.appendChild(c));
        b.categories.forEach(name => {
          const cat = el(`<div class="cat" data-name="${esc(name)}"><h3>${inline(name)}</h3><div class="drop"></div><button class="drop-btn">Put the selected card here</button></div>`);
          const put = () => { if (selected) { cat.querySelector(".drop").appendChild(selected); selected.setAttribute("aria-pressed", "false"); selected = null; } };
          cat.querySelector(".drop-btn").addEventListener("click", put);
          cat.addEventListener("dragover", e => e.preventDefault()); cat.addEventListener("drop", e => { e.preventDefault(); put(); });
          cats.appendChild(cat);
        });
        pool.addEventListener("dragover", e => e.preventDefault()); pool.addEventListener("drop", e => { e.preventDefault(); if (selected) { pool.appendChild(selected); selected.setAttribute("aria-pressed", "false"); selected = null; } });
        root.querySelector(".check").addEventListener("click", () => {
          let right = 0, placed = 0;
          cards.forEach(c => { const cat = c.closest(".cat"); c.classList.remove("right", "wrong"); if (cat) { placed++; const ok = cat.dataset.name === c.dataset.cat; c.classList.add(ok ? "right" : "wrong"); if (ok) right++; } });
          result.textContent = placed < cards.length ? `${cards.length - placed} card${cards.length - placed === 1 ? "" : "s"} still to place.` : (right === cards.length ? "All sorted. Nice." : `${right} of ${cards.length} in the right group. The red ones belong somewhere else.`);
        });
        root.querySelector(".reset").addEventListener("click", () => { cards.forEach(c => { c.classList.remove("right", "wrong"); pool.appendChild(c); }); result.textContent = ""; });
        if (AUDIT) { cards.forEach(c => { c.insertAdjacentHTML("beforeend", ` <small>(${esc(c.dataset.cat)})</small>`); }); }
        return root;
      },

      scenario(b) {
        const root = el(`<div class="block"><div class="scenario">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}<p class="setup">${inline(b.setup)}</p><div class="choices" role="group" aria-label="Your options"></div><div class="outcome" hidden><div class="verdict"></div><div class="o-body"></div></div></div></div>`);
        const choices = root.querySelector(".choices"), out = root.querySelector(".outcome");
        const btns = b.choices.map(c => { const btn = el(`<button class="choice" aria-pressed="false">${inline(c.text)}</button>`); btn.addEventListener("click", () => { btns.forEach(x => x.setAttribute("aria-pressed", "false")); btn.setAttribute("aria-pressed", "true"); out.hidden = false; out.className = "outcome " + (c.best ? "best" : "okay"); out.querySelector(".verdict").textContent = c.best ? "Best choice" : "What happens"; out.querySelector(".o-body").innerHTML = paras(c.outcome); }); choices.appendChild(btn); return btn; });
        if (AUDIT) { out.hidden = false; out.querySelector(".o-body").innerHTML = b.choices.map(c => `<p><strong>${c.best ? "Best: " : ""}${inline(c.text)}</strong> ${inline(c.outcome)}</p>`).join(""); }
        return root;
      },

      knowledge(b) {
        const root = el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}<div class="kc-set"></div></div>`);
        const set = root.querySelector(".kc-set");
        b.questions.forEach((q, i) => set.appendChild(question(q, i + 1, b.questions.length, null)));
        return root;
      },

      quiz(b) {
        const root = el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}${b.intro ? `<p style="margin-bottom:14px">${inline(b.intro)}</p>` : ""}<div class="kc-set"></div><div class="quiz-results" hidden><div class="score"></div><p class="msg"></p><div class="actions" style="justify-content:center;margin-top:14px"><button class="btn retry">Try again</button></div></div></div>`);
        const set = root.querySelector(".kc-set"), results = root.querySelector(".quiz-results");
        const state = { answered: 0, right: 0 };
        const qs = b.shuffle === false ? b.questions : shuffle(b.questions);
        function build() {
          set.innerHTML = ""; state.answered = 0; state.right = 0; results.hidden = true;
          qs.forEach((q, i) => set.appendChild(question(q, i + 1, qs.length, ok => { state.answered++; if (ok) state.right++; if (state.answered === qs.length) { const pct = Math.round(100 * state.right / qs.length); results.hidden = false; results.querySelector(".score").textContent = `${state.right} of ${qs.length}`; results.querySelector(".msg").textContent = pct >= (b.pass || 80) ? (b.passText || "You passed. The feedback above tells you why each answer is right.") : (b.failText || "Not quite yet. Read the feedback, open the lesson it points to, and try again."); results.scrollIntoView({ behavior: "smooth", block: "nearest" }); } })));
        }
        root.querySelector(".retry").addEventListener("click", build);
        build();
        return root;
      },

      continue(b) {
        const btn = el(`<div class="block continue"><button class="btn">${inline(b.label || "Continue")}</button></div>`);
        btn.querySelector("button").addEventListener("click", () => { const next = btn.nextElementSibling; if (next) next.scrollIntoView({ behavior: "smooth", block: "start" }); });
        return btn;
      },

      image(b) {
        if (b.real !== true) throw new Error("an image block is a real capture and needs real: true; a drawn screen is a mockup block");
        if (typeof b.alt !== "string" || !b.alt.trim()) throw new Error("an image block needs an alt sentence describing the capture");
        if (b.real && !b.source) throw new Error("a real capture needs a source, such as \"Copilot Chat\" or \"Copilot in Word\"");
        const label = b.real ? `Real capture of ${esc(b.source)}, cropped.` : "Drawn illustration, not a screenshot.";
        return el(`<div class="block"><figure class="capture" style="margin:0"><img src="${esc(b.src)}" alt="${esc(b.alt)}" loading="lazy" width="${b.width || 1200}" height="${b.height || 700}"><figcaption class="mk-caption">${b.caption ? inline(b.caption) + " " : ""}<span class="mk-drawn">${label}</span></figcaption></figure></div>`);
      },

      demo(b) {
        const root = el(`<div class="block">${b.heading ? `<h2>${inline(b.heading)}</h2>` : ""}${b.intro ? `<p style="margin-bottom:14px">${inline(b.intro)}</p>` : ""}<div class="demo"><div class="demo-head"><span class="num"></span><h3></h3></div><figure class="capture" style="margin:14px 0 0"><img alt="" width="1200" height="700"><figcaption class="mk-caption"><span class="demo-body"></span> <span class="mk-drawn"></span></figcaption></figure><div class="step-nav"><button class="btn ghost small prev">Back</button><div class="dots"></div><button class="btn small next">Next step</button></div></div></div>`);
        const steps = b.steps; let i = 0;
        steps.forEach(s => { if (!s.src || !s.alt || !s.source) throw new Error("each demo step needs src, alt, and source"); });
        const num = root.querySelector(".num"), h = root.querySelector("h3"), img = root.querySelector("img"), body = root.querySelector(".demo-body"), lab = root.querySelector(".mk-drawn"), dots = root.querySelector(".dots"), prev = root.querySelector(".prev"), next = root.querySelector(".next");
        steps.forEach(() => dots.appendChild(el(`<span></span>`)));
        function show() { const s = steps[i]; num.textContent = i + 1; h.textContent = s.title; img.src = s.src; img.alt = s.alt; body.innerHTML = inline(s.body); lab.textContent = `Real capture of ${s.source}, cropped.`; [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i)); prev.disabled = i === 0; next.textContent = i === steps.length - 1 ? "Start over" : "Next step"; }
        prev.addEventListener("click", () => { if (i > 0) { i--; show(); } });
        next.addEventListener("click", () => { i = i < steps.length - 1 ? i + 1 : 0; show(); });
        show();
        if (AUDIT) { root.querySelector(".demo").insertAdjacentHTML("beforeend", steps.map((s, k) => `<div class="audit-step"><h4>${k + 1}. ${inline(s.title)}</h4><img src="${esc(s.src)}" alt="${esc(s.alt)}" width="1200" height="700"><p>${inline(s.body)} <span class="mk-drawn">Real capture of ${esc(s.source)}, cropped.</span></p></div>`).join("")); }
        return root;
      },

      prompts(b) {
        const ids = b.ids || [];
        const list = ids.map(idv => (course.prompts || []).find(p => p.id === idv)).filter(Boolean);
        if (list.length !== ids.length) throw new Error("a prompts block names an id that is not in the prompts array");
        const root = el(`<div class="block"><h2>${inline(b.heading || "Prompts to copy")}</h2>${b.intro ? `<p style="margin-bottom:14px">${inline(b.intro)}</p>` : ""}<div class="prompt-cards"></div></div>`);
        const grid = root.querySelector(".prompt-cards");
        list.forEach(p => {
          const card = el(`<div class="prompt-card"><div class="pc-top"><span class="pc-app">${esc(p.app)}</span><span class="pc-task">${inline(p.task)}</span></div><p class="pc-text">${inline(p.prompt)}</p>${p.note ? `<p class="pc-note">${inline(p.note)}</p>` : ""}<button class="btn ghost small copy">Copy prompt</button></div>`);
          const btn = card.querySelector(".copy");
          btn.addEventListener("click", async () => { try { await navigator.clipboard.writeText(p.prompt); btn.textContent = "Copied"; } catch (e) { btn.textContent = "Select and copy the text above"; } setTimeout(() => { btn.textContent = "Copy prompt"; }, 2000); });
          grid.appendChild(card);
        });
        return root;
      },

      links(b) {
        return el(`<div class="block link-row">${b.items.map(i => `<a class="btn${i.ghost ? " ghost" : ""}" href="${esc(i.href)}">${inline(i.label)}</a>`).join("")}</div>`);
      },

      divider() { return el(`<hr class="divider block">`); }
    };

    /* A question: multiple choice, multiple response, or fill in the blank. Feedback explains why. */
    function question(q, n, total, onDone) {
      const type = q.type || "choice";
      const typeText = { choice: "Pick one", multi: "Pick all that apply", fill: "Type your answer" }[type];
      const root = el(`<div class="kc"><div class="kc-label">Question ${n} of ${total}</div><div class="q">${inline(q.q)}</div><div class="q-type">${typeText}</div><div class="opts"></div><div class="actions"><button class="btn small submit">Check</button><button class="btn ghost small again" hidden>Try again</button></div><div class="fb" hidden><span class="verdict"></span><div class="fb-body"></div></div></div>`);
      const opts = root.querySelector(".opts"), submit = root.querySelector(".submit"), again = root.querySelector(".again"), fb = root.querySelector(".fb");
      const name = id("q");
      let inputs = [];
      if (type === "fill") {
        const input = el(`<input type="text" aria-label="Your answer" autocomplete="off">`);
        opts.replaceWith(input); inputs = [input];
        input.addEventListener("keydown", e => { if (e.key === "Enter") submit.click(); });
      } else {
        (q.shuffle === false ? q.options : shuffle(q.options)).forEach(o => {
          const oid = id("o");
          const lab = el(`<label class="opt"><input type="${type === "multi" ? "checkbox" : "radio"}" name="${name}" id="${oid}"><span>${inline(o.text)}</span></label>`);
          lab._opt = o; opts.appendChild(lab); inputs.push(lab);
        });
      }
      let done = false;
      submit.addEventListener("click", () => {
        if (done) return;
        let ok = false, body = "";
        if (type === "fill") {
          const v = inputs[0].value.trim().toLowerCase();
          if (!v) { inputs[0].focus(); return; }
          ok = (q.answers || [q.answer]).some(a => v === String(a).toLowerCase() || (q.loose !== false && v.includes(String(a).toLowerCase())));
          body = `<p>${inline(q.feedback || "")}</p>${ok ? "" : `<p>An answer that works: <strong>${inline(q.answer || q.answers[0])}</strong></p>`}`;
        } else {
          const picked = inputs.filter(l => l.querySelector("input").checked);
          if (!picked.length) { inputs[0].querySelector("input").focus(); return; }
          ok = inputs.every(l => l.querySelector("input").checked === !!l._opt.correct);
          inputs.forEach(l => { const c = l.querySelector("input").checked; if (c && l._opt.correct) l.classList.add("right"); else if (c) l.classList.add("wrong"); else if (l._opt.correct) l.classList.add("missed"); l.querySelector("input").disabled = true; });
          const lines = inputs.filter(l => l.querySelector("input").checked || l._opt.correct).map(l => `<li><strong>${inline(l._opt.text)}:</strong> ${inline(l._opt.feedback || (l._opt.correct ? "Correct." : "Not this one."))}</li>`);
          body = `${q.feedback ? `<p>${inline(q.feedback)}</p>` : ""}<ul>${lines.join("")}</ul>`;
        }
        done = true;
        fb.hidden = false; fb.className = "fb " + (ok ? "good" : "bad");
        fb.querySelector(".verdict").textContent = ok ? "Correct" : "Not quite";
        fb.querySelector(".fb-body").innerHTML = body;
        submit.hidden = true; if (!ok) again.hidden = false;
        if (onDone) onDone(ok);
      });
      again.addEventListener("click", () => {
        done = false; fb.hidden = true; submit.hidden = false; again.hidden = true;
        if (type === "fill") { inputs[0].value = ""; inputs[0].focus(); }
        else inputs.forEach(l => { l.classList.remove("right", "wrong", "missed"); const i = l.querySelector("input"); i.disabled = false; i.checked = false; });
      });
      if (AUDIT) {
        fb.hidden = false;
        fb.querySelector(".fb-body").innerHTML = type === "fill" ? `<p>Answer: ${inline(q.answer || q.answers[0])}. ${inline(q.feedback || "")}</p>` : `<ul>${q.options.map(o => `<li>${o.correct ? "Correct: " : ""}${inline(o.text)}. ${inline(o.feedback || "")}</li>`).join("")}</ul>`;
      }
      return root;
    }

    /* ---------- course chrome ---------- */
    const lessons = course.lessons;
    const doneCount = () => lessons.filter(l => progress[l.id]).length;

    function renderOutline(current) {
      const list = document.getElementById("outlineList"); list.innerHTML = "";
      lessons.forEach((l, i) => {
        const li = el(`<li class="${progress[l.id] ? "done" : ""}"><button ${current === l.id ? 'aria-current="page"' : ""}><span class="dot"><svg><use href="#tick"/></svg></span><span>${i + 1}. ${esc(l.title)}</span></button></li>`);
        li.querySelector("button").addEventListener("click", () => { location.hash = l.id; closeMenu(); });
        list.appendChild(li);
      });
      const pct = Math.round(100 * doneCount() / lessons.length);
      document.getElementById("pct").textContent = `${pct}% complete`;
      document.getElementById("barFill").style.width = pct + "%";
      document.getElementById("railFill").style.width = pct + "%";
    }

    function renderLesson(l, i, standalone) {
      const sec = el(`<section class="lesson" data-lesson="${esc(l.id)}" aria-labelledby="h-${esc(l.id)}"><header class="lesson-head"><div class="count">Lesson ${i + 1} of ${lessons.length}</div><h1 id="h-${esc(l.id)}">${esc(l.title)}</h1>${l.intro ? `<p class="intro">${inline(l.intro)}</p>` : ""}${l.madeWith === "copilot" ? `<p class="made">${inline(l.madeLine || course.madeWithShort || "Lesson text drafted with Copilot Chat, then edited by hand. See the last lesson.")}</p>` : ""}</header><div class="blocks"></div></section>`);
      const blocks = sec.querySelector(".blocks");
      (l.blocks || []).forEach((b, k) => {
        const fn = RENDER[b.type];
        let node;
        try { node = fn ? fn(b) : el(`<div class="block statement"><div class="label">Unknown block</div><p>Lesson "${esc(l.id)}", block ${k + 1}: no renderer for type "${esc(b.type)}".</p></div>`); }
        catch (err) { node = el(`<div class="block statement"><div class="label">Block did not render</div><p>Lesson "${esc(l.id)}", block ${k + 1} (${esc(b.type)}): ${esc(err.message)}. Check that block in content.js.</p></div>`); }
        node.setAttribute("data-block", b.type);
        blocks.appendChild(node);
      });
      if (!standalone) return sec;
      const prev = lessons[i - 1], next = lessons[i + 1];
      const nav = el(`<nav class="lesson-nav" aria-label="Lesson navigation"></nav>`);
      nav.appendChild(prev ? el(`<a href="#${esc(prev.id)}"><span class="k">Previous</span><span>${esc(prev.title)}</span></a>`) : el(`<span class="placeholder"></span>`));
      if (next) { const a = el(`<a class="next" href="#${esc(next.id)}"><span class="k">Next lesson</span><span>${esc(next.title)}</span></a>`); a.addEventListener("click", () => markDone(l.id)); nav.appendChild(a); }
      else { const b = el(`<button class="next"><span class="k">Finish</span><span>Mark the course complete</span></button>`); b.addEventListener("click", () => { markDone(l.id); location.hash = ""; }); nav.appendChild(b); }
      sec.appendChild(nav);
      return sec;
    }

    function markDone(idv) { progress[idv] = true; saveProgress(progress); }

    function renderCover() {
      const total = lessons.reduce((n, l) => n + (l.minutes || 3), 0);
      const first = lessons.find(l => !progress[l.id]) || lessons[0];
      const started = doneCount() > 0;
      const sec = el(`<section class="cover"><div class="kicker">${esc(course.kicker || "A short course")}</div><h1>${esc(course.title)}</h1><p class="sub">${inline(course.description)}</p><div class="facts"><span>${lessons.length} lessons</span><span>About ${total} minutes</span><span>${esc(course.author || "")}</span></div><div class="start"><a class="btn" href="#${esc(first.id)}">${started ? "Resume" : "Start the course"}</a></div><p class="madeline">${inline(course.madeLine || "")}</p><div class="cover-outline"><h2>What is inside</h2><ol>${lessons.map((l, i) => `<li><a href="#${esc(l.id)}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span>${esc(l.title)}</span><span class="d">${l.minutes || 3} min</span></a></li>`).join("")}</ol></div></section>`);
      return sec;
    }

    function route() {
      const hash = decodeURIComponent(location.hash.replace("#", ""));
      main.innerHTML = "";
      if (AUDIT) {
        document.body.classList.add("audit");
        lessons.forEach((l, i) => main.appendChild(renderLesson(l, i, false)));
        const expected = lessons.reduce((n, l) => n + (l.blocks || []).length, 0);
        const meta = document.createElement("meta"); meta.name = "audit";
        meta.content = `scrollWidth=${main.scrollWidth},clientWidth=${main.clientWidth},expected=${expected}`;
        document.head.appendChild(meta);
        return;
      }
      const i = lessons.findIndex(l => l.id === hash);
      if (i < 0) { main.appendChild(renderCover()); renderOutline(null); }
      else { main.appendChild(renderLesson(lessons[i], i, true)); renderOutline(lessons[i].id); }
      window.scrollTo({ top: 0, behavior: "auto" });
      document.title = i < 0 ? course.title : `${lessons[i].title} - ${course.title}`;
    }

    const outline = document.getElementById("outline"), menuBtn = document.getElementById("menuBtn");
    function closeMenu() { outline.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }
    menuBtn.addEventListener("click", () => { const open = outline.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", String(open)); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
    document.getElementById("courseName").textContent = course.title;
    window.addEventListener("hashchange", route);
    route();
  })();
  </script>
</body>
</html>
